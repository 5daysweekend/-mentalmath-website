<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Math</title>

    <!-- 1. Sofortiger JavaScript-Redirect (ohne Render-Verzögerung & ohne Back-Button-Falle) -->
    <script>
        window.location.replace("https://5daysweekend.com/mentalmath/");
    </script>

    <!-- 2. Fallback für Browser ohne JavaScript -->
    <meta http-equiv="refresh" content="0; url=https://5daysweekend.com/mentalmath/">

    <!-- 3. Gleiche Hintergrundfarbe & verzögerter Text gegen Aufblitzen -->
    <style>
        body {
            background-color: #0f2027;
            color: #b0bec5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        /* Erscheint erst nach 1.5 Sekunden, falls Weiterleitung blockiert wird */
        .fallback-text {
            opacity: 0;
            animation: fadeIn 0.4s ease 1.5s forwards;
            text-align: center;
        }
        a {
            color: #00d2ff;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="fallback-text">
        <p>Redirecting to <a href="https://5daysweekend.com/mentalmath/">Mental Math</a>...</p>
    </div>
</body>
</html>
