<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Math — Challenge Your Brain</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --accent-color: #00d2ff;
            --text-main: #ffffff;
            --text-sub: #b0bec5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--primary-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
        }

        .app-logo {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeIn 1s ease-out;
        }

        .tagline {
            font-size: 1.4rem;
            font-weight: 400;
            color: var(--text-sub);
            margin-bottom: 40px;
            max-width: 450px;
            line-height: 1.4;
            animation: fadeIn 1.2s ease-out;
        }

        .badge-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeIn 1.4s ease-out;
        }

        .badge-container img {
            height: 52px;
            border-radius: 7px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
        }

        .badge-container img:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 30px 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.1);
        }

        footer a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            margin: 0 12px;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .app-logo { font-size: 2.8rem; }
            .tagline { font-size: 1.15rem; }
            .badge-container { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <h1 class="app-logo">Mental Math</h1>
        <p class="tagline">Challenge your brain, improve your calculation speed, and master your mind.</p>

        <div class="badge-container">
            <a href="YOUR_GOOGLE_PLAY_STORE_LINK" target="_blank">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Five Days Weekend Games. All rights reserved.</p>
        <p style="margin-top: 8px;">
            <a href="legal.html">Legal Notice</a>
            <a href="privacy.html">Privacy Policy</a>
        </p>
    </footer>

</body>
</html>
